<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div>
            <p class="display-text">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Unde quos magni dignissimos vel quia! Sed consequatur quod iste aspernatur ratione!
            </p>
        </div>
        <div>
            <textarea name="text" cols="48" rows="10" id="input"></textarea>
        </div>
    </div>


    <div class="result">
        <div class="result-header">
            <h1>Result</h1>

            <div id="close-btn">Close</div>
        </div>

        <div>
            <p>Accuracy</p>
            <span id="accuracy">10%</span>
        </div>

        <div>
            <p>Word per minute</p>
            <span id="wpm">10%</span>
        </div>

        <div>
            <p>Finished in</p>
            <span id="time">10%</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
